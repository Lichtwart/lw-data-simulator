[package]
name = "lichtwart-demo-simulator"
version = "0.1.1"
description = "Lichtwart Demo Simulator — simulates Lichtwart Core v2 devices in Cumulocity"
authors = ["Lichtwart GmbH"]
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "lw_sim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
tauri-plugin-log = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart", "cookies"] }
keyring-core = "1"
log = "0.4"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.8"
tokio-util = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# IANA time zones for `dailyProfile` (device `lw_configCore.timeZone`, DST-safe).
chrono-tz = "0.10"

[dev-dependencies]
# Fake Cumulocity server for tests (`c8y::fake`).
axum = "0.8"
base64 = "0.23"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "test-util"] }
# Validates library/** against library/schema/ in `cargo test` (`library::schema_tests`).
jsonschema = { version = "0.58", default-features = false }

# OS credential stores (PRD §4: macOS Keychain / Windows Credential Manager).
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
